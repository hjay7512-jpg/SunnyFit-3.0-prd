<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SunnyFit · AI 动效诊断</title><style>body{margin:0;background:#f4f6fa;color:#253046;font:16px/1.7 system-ui,sans-serif}main{display:flex;gap:32px;max-width:1080px;margin:24px auto;padding:16px;align-items:flex-start}iframe{width:390px;height:844px;border:1px solid #d8deea;border-radius:22px;flex:none;background:white}section{min-width:260px;max-width:520px}h1{font-size:24px}p{overflow-wrap:anywhere}button,a{display:inline-block;padding:10px 16px;border-radius:12px;border:1px solid #ccd5e3;background:white;color:#253046;font:inherit;cursor:pointer}code{font-size:13px}#result{white-space:pre-wrap;padding:16px;background:white;border-radius:16px;font:14px/1.8 system-ui}small{color:#66738a}@media(max-width:760px){main{flex-direction:column}iframe{max-width:100%}}</style></head>
<body><main><iframe id="demo" title="真实 SunnyFit 首页" src="/#/app/home?user=DEMO-1003&amp;review=0"></iframe><section><h1>实际浏览器 AI 动效诊断</h1><p>左侧加载当前构建的真实首页。以下数据来自这个浏览器正在绘制的 AI 球。</p><pre id="result" role="status">正在读取…</pre><button id="blink" type="button">立即测试一次眨眼</button><p><a href="/#/app/home?user=DEMO-1003&amp;review=0">回到首页</a></p><small>仅用于本地诊断；不会更改系统设置或账户数据。</small></section></main><script>
const frame=document.getElementById('demo'),result=document.getElementById('result');let count=0,minBlink=1,maxBlink=0,minX=Infinity,maxX=-Infinity,minColour=Infinity,maxColour=-Infinity,lastClosed=false,lastPrint=0
const selectedMotion=new URLSearchParams(location.search).get('motion');if(['system','full','reduce'].includes(selectedMotion))frame.src='/?motion='+selectedMotion+'#/app/home?user=DEMO-1003&review=0'
document.getElementById('blink').onclick=()=>{const ball=frame.contentDocument.querySelector('[data-action="coach"] .sf-ai-ball');if(ball)ball.dispatchEvent(new Event('pointerenter'))}
function inspect(now){try{const documentInFrame=frame.contentDocument,ball=documentInFrame.querySelector('[data-action="coach"] .sf-ai-ball');if(ball){const eyes=ball.querySelector('.sf-ai-ball__lid'),look=ball.querySelector('.sf-ai-ball__eye'),colour=ball.querySelector('[data-face-track=colours]'),style=frame.contentWindow.getComputedStyle(eyes);const matrix=e=>new DOMMatrixReadOnly(frame.contentWindow.getComputedStyle(e).transform),blink=matrix(eyes).m22,x=look?matrix(look).m41:0,cx=matrix(colour).m41;minBlink=Math.min(minBlink,blink);maxBlink=Math.max(maxBlink,blink);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minColour=Math.min(minColour,cx);maxColour=Math.max(maxColour,cx);const closed=blink<.3;if(closed&&!lastClosed)count++;lastClosed=closed;if(now-lastPrint>500){lastPrint=now;const script=[...documentInFrame.scripts].find(s=>/\/js\/app\./.test(s.src));result.textContent=['浏览器：'+navigator.userAgent,'系统减少动态：'+(matchMedia('(prefers-reduced-motion: reduce)').matches?'开启':'关闭'),'CSS 动画：'+style.animationName,'播放状态：'+style.animationPlayState,'组件暂停：'+ball.classList.contains('sf-ai-ball--paused'),'标签页状态：'+document.visibilityState,'已检测眨眼：'+count+' 次','眼睛闭合比例：'+minBlink.toFixed(2)+' ～ '+maxBlink.toFixed(2),'眼睛位移幅度：'+(maxX-minX).toFixed(2)+' px','色团位移幅度：'+(maxColour-minColour).toFixed(2)+' px','加载版本：'+(script?new URL(script.src).pathname:'未取得')].join('\n')}}else if(now-lastPrint>1000){lastPrint=now;result.textContent='等待真实首页的 AI 球加载…'}}catch(error){result.textContent=error.message}requestAnimationFrame(inspect)}requestAnimationFrame(inspect)
</script></body></html>
